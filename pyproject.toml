[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pitkind"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.30.0",
    "pydantic>=2.7.0",
    "typer>=0.12.3",
    "httpx>=0.27.0",
    "blockfrost-python>=0.7.0,<1",
    "requests>=2.31.0",
    "pyyaml>=6.0.1",
    "anyio>=4.4.0",
]

[project.scripts]
pitkind = "pitkind.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
]

[tool.hatch.build.targets.wheel]
packages = ["pitkind"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
